name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  core:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run automated regression
        shell: pwsh
        run: python run_ci.py --fast
